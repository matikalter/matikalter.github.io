  /* "Full length" dividers bleed out of the content margins so the rule runs the
     whole main section — from the toolbar's edge divider to the page's right
     edge. Class on <html> (like the other mode flags) so it survives re-renders. */
  html.proj-divider-full .proj-divider {
    margin-left:  calc(-1 * var(--proj-margin-x, 24px));
    margin-right: calc(-1 * var(--proj-margin-x, 24px));
  }
  .proj-text-title {
    font-size:      var(--h5-size);
    font-weight:    var(--h5-weight);
    line-height:    var(--h5-leading);
    letter-spacing: var(--h5-tracking);
    color: var(--proj-title-color, var(--text));
    margin: 0 0 var(--proj-title-gap, 12px);
    text-wrap: pretty;
  }
  /* TITLE UNDERLINE (Texts → Title underline): a 1px rule exactly halfway
     between title and body — half the gap above it, half below. Stack mode only. */
  html.proj-title-rule .proj-text:not(.mode-beside) .proj-text-title:not(:last-child) {
    padding-bottom: calc(var(--proj-title-gap, 12px) / 2);
    margin-bottom:  calc(var(--proj-title-gap, 12px) / 2);
    border-bottom: 1px solid var(--proj-title-rule-c, var(--border));
  }
  /* TITLE BESIDE BODY: the block spans both columns and its inner box is a
     copy of the page grid, so the title sits in the left column and the body
     in the right one, aligned with the content around it. */
  .proj-text.mode-beside .proj-text-inner {
    max-width: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--proj-gap-x, 12px);
    align-items: start;
  }
  .proj-text.mode-beside .proj-text-title { margin: 0; max-width: var(--proj-text-maxw, 560px); }
  .proj-text.mode-beside .proj-text-body  { grid-column: 2; max-width: var(--proj-text-maxw, 560px); }
  /* lead glyph (Tweaks → Project page → Texts → Title glyph): character,
     colour and gap are vars; html.proj-glyph-off removes it. */
  .proj-text-title::before {
    content: var(--proj-glyph, '\2192');
    color: var(--proj-glyph-color, var(--text-muted));
    margin-right: var(--proj-glyph-gap, 10px);
  }
  html.proj-glyph-off .proj-text-title::before { content: none; }
  /* no body → drop the title's body-gap so a title-only block isn't bottom-heavy */
  .proj-text-title:last-child { margin-bottom: 0; }
  .proj-text-body {
    font-size:      var(--body-size);
    font-weight:    var(--body-weight);
    line-height:    var(--body-leading);
    letter-spacing: var(--body-tracking);
    color: var(--proj-body-color, var(--text-muted));
    text-wrap: pretty;
  }
  .proj-text-body p { margin: 0 0 1em; }
  .proj-text-body p:last-child { margin-bottom: 0; }
  /* text links (project desc + body): highlight color */
  .lp-proj-desc a, .proj-text-body a, .about-bio a {
    color: var(--highlight); text-decoration: none;
    transition: opacity .15s;
  }
  /* ONE link underline for every text link (desc / body / about / bio links):
     Typography → Link underline (--link-ul-w thickness, --link-ul-off offset) */
  .lp-proj-desc a:hover, .proj-text-body a:hover, .about-bio a:hover {
    text-decoration: underline;
    text-decoration-thickness: var(--link-ul-w, 1px);
    text-underline-offset: var(--link-ul-off, 0.16em);
  }

  /* row block — N images side by side, full width. Each item's flex-grow is set
     to its real aspect ratio (measured on load) so all share one height and the
     row fills the width. A row with `maxW` is capped + centered (single logos). */
  .proj-row {
    grid-column: 1 / -1;
    display: flex;
    gap: var(--proj-gap-x, 12px);
    align-items: stretch;
  }
  .proj-row-item { flex: 1 1 0; min-width: 0; }
  .proj-row-item img { display: block; width: 100%; height: auto; }
  /* scaled row item: image shrunk to --item-scale, centered (default) or
     glued to one side of its slot via align-left/align-right */
  .proj-row-item.proj-row-scaled { display: flex; align-items: center; justify-content: center; }
  .proj-row-item.proj-row-scaled img { transform: scale(var(--item-scale, 1)); transform-origin: center; }
  .proj-row-item.proj-row-scaled.align-left  { justify-content: flex-start; }
  .proj-row-item.proj-row-scaled.align-left  img { transform-origin: left center; }
  .proj-row-item.proj-row-scaled.align-right { justify-content: flex-end; }
  .proj-row-item.proj-row-scaled.align-right img { transform-origin: right center; }
  .proj-row-video { align-self: stretch; }
  .proj-row-video .proj-video { width: 100%; height: 100%; }
  .proj-row-localvideo .proj-localvideo { width: 100%; }
  .proj-row.proj-row-center { justify-content: center; }

  /* ── POSTERS GALLERY ── static multi-column justified grid. Row structure +
     per-tile box sizing are computed in js/posters-gallery.js; the image fills
     its box with object-fit:contain (whitespace invisible on white). Tiles
     scale on hover and open the shared image lightbox on click. */
  .posters-gallery { width: 100%; }
  /* embedded in a content page's block flow: the mount must NEVER be sized by
     its own content (px tile widths can round a hair past the available width,
     which would grow a content-sized grid item and re-trigger the gallery's
     ResizeObserver in a feedback loop) */
  .proj-block.posters-gallery { min-width: 0; max-width: 100%; overflow: hidden; }
  .posters-row { display: flex; align-items: flex-start; min-width: 0; }
  .posters-row:last-child { margin-bottom: 0 !important; }
  .posters-tile {
    position: relative; flex: 0 0 auto; min-width: 0; overflow: visible;
  }
  .posters-tile img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    cursor: zoom-in;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .posters-tile:hover { z-index: 2; }
  .posters-tile:hover img { transform: scale(var(--posters-hover-scale, 1.04)); }
  @media (hover: none) { .posters-tile:hover img { transform: none; } }

  /* hscroll: full-width horizontal gallery with edge arrows */
  .proj-hscroll { grid-column: 1 / -1; position: relative; }
  .proj-hscroll-track {
    display: flex;
    gap: var(--proj-gap-x, 12px);
    height: min(104.5vh, 862px);
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
    overscroll-behavior-x: contain;
  }
  .proj-hscroll-track::-webkit-scrollbar { display: none; }
  .proj-hscroll-track img {
    height: 100%; width: auto; flex: 0 0 auto;
    display: block; cursor: zoom-in;
  }
  .proj-hscroll-arrow {
    position: absolute; top: 50%; margin-top: -21px;
    z-index: 4; box-sizing: border-box;
    width: 42px; height: 42px; min-width: 42px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1; color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border); border-radius: 50%; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s;
  }
  .proj-hscroll-arrow:hover { background: var(--bg-secondary); }
  .proj-hscroll-arrow.prev { left: 12px; }
  .proj-hscroll-arrow.next { right: 12px; }
  .proj-hscroll-arrow.visible { opacity: 1; pointer-events: auto; }
  /* legacy raw-html text blocks keep body styling */
  .proj-text > p { margin: 0 0 1em; font-size: var(--body-size);
    line-height: var(--body-leading); color: var(--proj-body-color, var(--text-muted)); }
  .proj-text > p:last-child { margin-bottom: 0; }

  /* empty-state placeholder block */
  .proj-ph {
    aspect-ratio: 16/10; background: var(--bg-secondary);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .08em;
  }

  /* ── ABOUT VIEW ── */
  .about-view { display: none; min-height: 100vh; }
  .about-view.visible {
    display: grid;
    /* left zone width = --about-split (the movable divider); right zone fills
       the rest. Margins + gap are tweakable. */
    grid-template-columns: var(--about-split, 40%) 1fr;
    column-gap: var(--about-gap, 48px);
    padding: var(--about-margin-y, 40px) var(--about-margin-x, 48px);
    min-height: 100vh;
  }
  .about-text-col {
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .about-bio {
    font-size:      var(--h4-size);
    font-weight:    var(--h4-weight);
    line-height:    var(--h4-leading);
    letter-spacing: var(--h4-tracking);
    color: var(--text);
    max-width: var(--about-text-maxw, none);
    white-space: pre-line;
  }
  .about-section { margin-bottom: 24px; }
  .about-section-title {
    font-size:      var(--h3-size);
    font-weight:    var(--h3-weight);
    line-height:    var(--h3-leading);
    letter-spacing: var(--h3-tracking);
    color: var(--text); margin-bottom: 8px;
  }
  .about-item {
    font-size:      var(--labels-size);
    font-weight:    var(--labels-weight);
    line-height:    var(--labels-leading);
    letter-spacing: var(--labels-tracking);
    color: var(--text); padding: 1px 0;
  }
  .about-item span { color: var(--text-faint); }
  /* Both zones are plain vertical stacks: the THREE blocks (bio, accolades,
     hero image) can each live in either column in any order — applyTweaks
     appends the nodes per the aboutLayout tweak. So no block owns its own
     spacing: ONE gap token separates every adjacent pair in either column,
     which keeps the two columns identical whatever the arrangement. */
  .about-reel-col {
    position: relative;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
  }
  .about-text-col > * + *,
  .about-reel-col > * + * { margin-top: var(--about-stack-gap, 40px); }
  .about-meta { max-width: var(--about-meta-maxw, none); }
  .about-meta .about-section:last-child { margin-bottom: 0; }
  /* ABOUT HERO IMAGE — sized as a % of its column and aligned within it. When
     it is the LAST block it also gets pushed to the column's bottom; mid-stack
     it just sits in the flow (margin-top:auto there would eat the gap). */
  .about-hero {
    width: 100%;
    display: flex;
    justify-content: var(--about-hero-align, flex-start);
  }
  .about-text-col > .about-hero:last-child,
  .about-reel-col > .about-hero:last-child { margin-top: auto; }
  .about-hero-img {
    display: block;
    width: var(--about-hero-size, 100%);
    height: auto;
  }

  /* =====================================================================
     ── HOME VIEW: VERTICAL INFINITE LIST ──
     Centered, scrollable column. Wheel scrolls thumbnails up/down. Infinite loop.
     Configuration variables are declared at top of <script> below.
     ===================================================================== */
  /* #home-view is NOT isolated: the invert-over-images blend (.blend-invert
     below) is applied to the overlay LAYER elements, which then composite
     against the ROOT backdrop — the white page bg AND the thumbnail stages
     painted beneath them. (Isolating here would exclude the body's white bg
     from the group, so text over empty areas would stay light instead of
     reading near-black.) */
  #home-view { display: block; }
  #home-view.hidden { display: none; }

  /* ── HOME LAYERS: REEL HERO ⇄ PROJECT SECTION ──
     Two viewport-sized fixed layers, translated in opposite directions by
     js/home-intro.js (reel slides up, the project section slides up from
     below and locks). Both are inset:0 so the position:fixed children inside
     resolve their offsets exactly as they did before the wrapper existed (a
     transformed ancestor becomes their containing block) — which is also why
     both layers are pointer-events:none, with the children that were
     hit-testable before explicitly restored below. No z-index on either: DOM
     order keeps the adaptive-invert copies (appended to #home-view after
     them) painting on top, and no background so the difference-blended title
     stack keeps the same backdrop it had. */
  /* Its own PERMANENT compositing layer. The intro writes/removes an inline
     transform on this element, and a layer that gets promoted on the first
     frame of a slide and demoted again when it settles is re-rasterised at
     both ends — that re-raster is what flashed hairlines along the video's top
     and bottom edges for the first moments after it locked into place. */
  .home-reel {
    position: fixed; inset: 0; pointer-events: none;
    will-change: transform; backface-visibility: hidden;
  }
  /* REEL AREA — the region the reel lives in: the main content window
     (right of the panel), or the whole page in Full page mode. It only
     positions the bounding box below; it draws nothing itself. */
  .home-reel-box {
    position: absolute;
    top: 0; bottom: 0;
    left: var(--left-w);
    right: 0;
    container-type: size;
    pointer-events: auto;
  }
  /* NOTE: no `transition: left` here on purpose — a transitioned calc(var(…))
     left got stuck at its pre-change value in Chrome (the box stayed offset by
     a phantom panel width after the toolbar collapsed). The box tracks
     --left-w instantly instead. */
  /* BOUNDING BOX — the reel's own frame inside the area (Tweaks → Reel →
     Bounding box). Sized in the AREA's container units, and itself a size
     container so the video frame inside sizes against IT. Three scaling modes:
       stretch (default) — width % and height % of the area, independently, so
                 the box's aspect follows the window's;
       uniform — html.reel-box-uniform: a LOCKED aspect ratio, scaled as the
                 largest box of that ratio that fits the area × Size. Box and
                 video keep their proportions and relative position at any
                 window size (uniform / proportional scaling);
       fixed   — html.reel-box-fixed: a px size that never scales (clamped to
                 the area so it can't spill off-screen).
     Position X/Y place it in the area's free space (0 = left/top, 50 =
     centred, 100 = right/bottom). Same WHOLE-PIXEL rule as the frame: size and
     offsets are each round()ed to 1px, with the unrounded pair first as the
     fallback for engines without CSS round(). */
  /* NOT a size container (on purpose): the video frame inside resolves its cq
     units against the AREA, and reads the box's size through the inherited
     --rb-w / --rb-h tokens instead — that is what lets the video be sized
     relative to the BOX or the WINDOW (Tweak reelVideoBasis).
     STRETCH (default) = fixed px MARGINS from the area's edges (--reel-mx /
     --reel-my): the gap to each window edge stays exactly the set distance at
     any window size; the box takes whatever is left. */
  .home-reel-bound {
    position: absolute;
    --rb-w: max(0px, calc(100cqw - 2 * var(--reel-mx, 0px)));
    --rb-h: max(0px, calc(100cqh - 2 * var(--reel-my, 0px)));
    width: var(--rb-w);
    height: var(--rb-h);
    left: calc((100cqw - var(--rb-w)) * var(--reel-bx, .5) + var(--reel-ox, 0px));
    top:  calc((100cqh - var(--rb-h)) * var(--reel-by, .5) + var(--reel-oy, 0px));
    width:  round(var(--rb-w), 1px);
    height: round(var(--rb-h), 1px);
    left: round(calc((100cqw - var(--rb-w)) * var(--reel-bx, .5) + var(--reel-ox, 0px)), 1px);
    top:  round(calc((100cqh - var(--rb-h)) * var(--reel-by, .5) + var(--reel-oy, 0px)), 1px);
  }
  html.reel-box-uniform .home-reel-bound {
    --rb-w: min(calc(var(--reel-bs, 1) * 100cqw), calc(var(--reel-bs, 1) * 100cqh * var(--reel-bar, 1.77778)));
    --rb-h: calc(var(--rb-w) / var(--reel-bar, 1.77778));
  }
  html.reel-box-fixed .home-reel-bound {
    --rb-w: min(calc(var(--reel-bwpx, 1280) * 1px), 100cqw);
    --rb-h: min(calc(var(--reel-bhpx, 720) * 1px), 100cqh);
  }
  /* FILL (cover) crops the video to the box, so the box clips; FIT leaves the
     frame unclipped (see the overscan note below). A visible border also
     clips — the iframe's 1px overscan would otherwise peek outside the line. */
  html.reel-cover .home-reel-bound,
  html.reel-border .home-reel-bound { overflow: hidden; }
  /* optional box outline — drawn INSIDE the box (inset:0) so it never changes
     the geometry, above the video + tint, and inert to the pointer. */
  .home-reel-bound::after {
    content: ''; position: absolute; inset: 0;
    display: none; pointer-events: none;
    border: var(--reel-border-w, 1px) solid var(--reel-border-c, #111);
  }
  html.reel-border .home-reel-bound::after { display: block; }
  /* VIDEO FRAME — the 16:9 film inside the bounding box. FIT (default min()) =
     the largest 16:9 that fits the box × Video size; FILL (html.reel-cover,
     max()) = covers the box and is cropped on the long axis. Video X/Y place
     it in the box's free (or overflowing) space.
     WHOLE-PIXEL GEOMETRY: width and height are each rounded to a whole pixel.
     A fractional box (519.75px tall) has to be antialiased, and the coverage of
     that partial edge row changes with the layer's sub-pixel offset — which is
     what shimmered as the slide came to rest. aspect-ratio is NOT used (it
     re-introduces a fractional height); the rounding step is 1px, NOT a
     multiple of 16 — a coarser step visibly failed to reach the window edge.
     NO background fill and NO overflow clip on the frame itself. */
  /* --rv-w / --rv-h = what the Video size % is measured against: the BOX
     (default) or the whole reel AREA (html.reel-vid-window), so the video's
     size can be set independently of the box. Position is always within the
     box. cq units here resolve against .home-reel-box (the area). */
  .home-reel-frame {
    position: absolute;
    --rv-w: var(--rb-w);
    --rv-h: var(--rb-h);
    --reel-fit: min(calc(var(--reel-size, 1) * var(--rv-w)), calc(var(--reel-size, 1) * var(--rv-h) * 16 / 9));
    width: var(--reel-fit);
    height: calc(var(--reel-fit) * 9 / 16);
    left: calc((var(--rb-w) - var(--reel-fit)) * var(--reel-vx, .5));
    top:  calc((var(--rb-h) - var(--reel-fit) * 9 / 16) * var(--reel-vy, .5));
    width:  round(var(--reel-fit), 1px);
    height: round(calc(var(--reel-fit) * 9 / 16), 1px);
    left: round(calc((var(--rb-w) - var(--reel-fit)) * var(--reel-vx, .5)), 1px);
    top:  round(calc((var(--rb-h) - var(--reel-fit) * 9 / 16) * var(--reel-vy, .5)), 1px);
  }
  html.reel-vid-window .home-reel-frame { --rv-w: 100cqw; --rv-h: 100cqh; }
  html.reel-cover .home-reel-frame {
    --reel-fit: max(calc(var(--reel-size, 1) * var(--rv-w)), calc(var(--reel-size, 1) * var(--rv-h) * 16 / 9));
  }
  /* 1px overscan on every edge, with NO clip on the frame — it simply overlaps
     the white page by a pixel, so rounding can never leave a white sliver
     between the video and the content-window edge. (The player fills a 16:9
     iframe with a 16:9 film, so the overscanned pixels are video, not
     letterbox.) The old version overscanned INSIDE an overflow:hidden frame
     with a black fill: that clip was one more antialiased boundary and the fill
     was what could flash dark at the edges.
     POINTER-EVENTS:NONE + the shield below — a cross-origin iframe SWALLOWS
     wheel/touch (the events are delivered inside the player document and never
     reach this page), so hovering the hero froze the scroll choreography. The
     shield is a transparent sibling ABOVE the iframe that takes the hit-test,
     so a wheel over the reel scrolls the page exactly like anywhere else on
     the home screen. Player chrome is hidden (controls=0) since it would no
     longer be clickable. */
  /* RESIZE SMOOTHNESS: home-intro.js (syncReelScale) pins the iframe to a
     FIXED layout size (inline width/height) and fits it to the frame with a
     transform: scale() instead. A cross-origin iframe whose LAYOUT size changes
     forces the browser to wait for the player's process to re-lay-out and
     produce a new frame before it presents the page — on every resize tick —
     which is what made the whole page (reel box, social icons…) hiccup while
     dragging the window's top edge. A transform never changes the child's
     size, so there is nothing to wait for. The rules below are the pre-JS
     fallback. */
  .home-reel-frame iframe {
    position: absolute; top: -1px; left: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    border: 0; display: block;
    pointer-events: none;
    transform-origin: 0 0;
  }
  .home-reel-shield { position: absolute; inset: 0; }
  /* colour wash over the video. Opacity IS the control (0% = invisible, 100% =
     the flat colour), so it can never eat the hit-test or the scroll. */
  /* BIO-LINK HOVER VIDEOS: one <video> per clip, stacked inside the reel's
     frame with the same 1px overscan as the iframe, cover-cropped to the 16:9
     frame (so the reel's size, Fit/Fill and bounding box all apply). Hidden
     unless .on — an instant cut while a linked word is hovered. */
  /* The layer fills the BOUNDING BOX (a sibling of .home-reel-frame inside
     .home-reel-bound), and each item covers it with object-fit — so it fills the
     box exactly like the reel does in Fill mode, at the smallest scale that
     covers it. It used to sit INSIDE the 16:9 frame, which in Fill mode is
     already larger than the box, so a second cover on top of that over-scaled
     non-16:9 media (most visible with a tall window). Cropping follows the
     reel's Video X/Y. Clips itself, so it never spills past the box. */
  .home-reel-alt { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .home-reel-alt video, .home-reel-alt img {
    position: absolute; top: -1px; left: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px); max-width: none;
    object-fit: cover; display: block; visibility: hidden;
    object-position: calc(var(--reel-vx, .5) * 100%) calc(var(--reel-vy, .5) * 100%);
  }
  .home-reel-alt .on { visibility: visible; }
  /* SLIDESHOW strip (a bio link with several media): items sit side by side at
     EXACTLY the box height (no upscaling past it), widths by native aspect, and
     the strip drifts left → right in a seamless loop (copies of the set fill
     the box width). Moved by a transform each frame — no layout per frame. */
  .home-reel-alt .bl-ss {
    position: absolute; top: 0; left: 0; height: 100%;
    display: flex; gap: var(--bl-ss-gap, 0px);
    visibility: hidden; will-change: transform;
  }
  .home-reel-alt .bl-ss.on { visibility: visible; }
  .home-reel-alt .bl-ss > img, .home-reel-alt .bl-ss > video {
    position: static; flex: none; height: 100%; width: auto; max-width: none;
    object-fit: initial; visibility: inherit; display: block;
  }
  /* linked words in the short bio: own idle / hover colour each, underline on
     hover. Words become inline-block .bw spans for the staggered slide, and
     text-decoration does NOT propagate into inline-blocks, so the underline is
     set on them too. */
  .lp-home-bio .bio-link { color: var(--bl-c, inherit); text-decoration: none; cursor: pointer; }
  .lp-home-bio .bio-link:hover,
  .lp-home-bio .bio-link:hover .bw {
    color: var(--bl-h, var(--bl-c, inherit));
    text-decoration: underline;
    text-decoration-thickness: var(--link-ul-w, 1px);
    text-underline-offset: var(--link-ul-off, 0.16em);
  }
  .home-reel-tint {
    position: absolute; inset: 0;
    pointer-events: none;
    background: var(--reel-tint, #000);
    opacity: var(--reel-tint-op, 0);
  }

  /* ── FULL-PAGE REEL MODE (html.reel-full) ──
     The reel spans the WHOLE page (toolbar included) and sits BEHIND the
     interface: .home-reel carries no z-index, so it paints below the panel
     (z-index 5) and below every project-section child — the panel just has to
     stop painting its own opaque background. Everything in the toolbar stays
     hoverable and clickable because it is still inside .left, above the reel
     and above the tint. */
  /* ROUTE-SCOPED: both mode classes only mean anything where the reel actually
     is — the HOME view with the toolbar EXPANDED. Unscoped, they stripped the
     panel's background + border on project/about pages too (no edge divider,
     and the expanded drawer's text floating over project content) and left the
     real ink transparent with no clone layer to replace it (invisible logo).
     html.route-home is toggled by HomeIntro.enter/leave. The collapsed drawer
     is excluded because it is a full-width overlay that needs its own opaque
     background. */
  html.reel-full.route-home .home-reel-box { left: 0; overflow: hidden; }
  /* the panel background/border DOES stay scoped — the collapsed drawer is a
     full-width overlay that needs its own opaque background. */
  html.reel-full.route-home .site:not(.tb-collapsed) .left {
    background: transparent; border-right-color: transparent;
  }
  /* the divider that slides up with the content (see #panel-edge-line markup).
     -1px so it lands exactly where the panel's border-right sits (border-box). */
  .panel-edge-line {
    display: none;
    position: fixed; top: 0;
    left: calc(var(--left-w) - 1px);
    /* width:0 + border-left, NOT a 1px-wide filled box: a filled box at a
       fractional x is antialiased across two columns, so it visibly flickered
       and changed thickness while the window scaled. A border renders as a
       crisp always-1px line, matching the panel's own border-right. (--left-w
       is also rounded to whole pixels now — see updateResponsiveLayout.) */
    width: 0; height: 100vh;
    border-left: 1px solid var(--panel-edge, var(--border));
    pointer-events: none;
  }
  html.reel-full.route-home .site:not(.tb-collapsed) .panel-edge-line { display: block; }
  .site.tb-collapsed .panel-edge-line { display: none; }

  /* the reel's own DOWN-only affordance — placed beneath the video by
     home-intro.js (measured off the frame, so it follows the Size control).
     Clickable: it also triggers the reveal. */
  .scroll-marker.reel-marker {
    position: absolute; bottom: auto;
    pointer-events: none; cursor: pointer;
  }
  /* only hit-testable while SHOWN — faded out (opacity 0, e.g. once the reel
     has been scrolled past) it used to keep catching the mouse, and in its
     toolbar placement (fixed, z 250, over the panel) that silently ate hovers /
     clicks on whatever sat beneath it, like the toolbar filter buttons */
  .scroll-marker.reel-marker.is-visible { pointer-events: auto; }
  /* toolbar placement: reparented to <body>, above the panel (below the
     collapsed drawer at 300) */
  .scroll-marker.reel-marker.in-toolbar { position: fixed; z-index: 250; }
  /* parked below the fold until home-intro.js takes over (an inline transform,
     `none` once it locks in) — otherwise the project section would flash in
     place for one frame on a cold load. */
  .home-projects { position: fixed; inset: 0; pointer-events: none; transform: translateY(100vh); }
  /* NOTE: only children that were hit-testable as direct children of
     #home-view. The title stack, mini-info and tags layer are deliberately
     pointer-events:none with their rows/pills opting back in — leave them
     alone (a descendant's `auto` still hits through a `none` ancestor). */
  .home-projects > .display-switch,
  .home-projects > .list-stage,
  .home-projects > .gallery-stage,
  .home-projects > .lp-filter-block,
  .home-projects > .mini-hit { pointer-events: auto; }

  /* ── DISPLAY MODE TOGGLES (List ⇄ Gallery) ──
     The home view carries .mode-list or .mode-gallery; each hides the other
     display's stage. In gallery mode the list's marker, connector line and
     scroll markers are irrelevant, so they're hidden too. */
  #home-view .gallery-stage { display: none; }
  #home-view.mode-gallery .list-stage { display: none; }
  #home-view.mode-gallery .gallery-stage { display: block; }
  #home-view.mode-gallery .list-marker,
  #home-view.mode-gallery .list-marker-line { display: none !important; }
  /* the hover-driven title + mini must not intercept pointer events in gallery
     mode (they're centered overlays) — otherwise tiles beneath the shown title
     never register hover and the title sticks on whichever project it last
     showed. Make them inert so hovers always reach the thumbnails. */
  #home-view.mode-gallery .lp-title-stack,
  #home-view.mode-gallery .lp-title-row,
  #home-view.mode-gallery .mini-info,
  #home-view.mode-gallery .mini-info *,
  #home-view.mode-gallery .mini-tags-layer,
  #home-view.mode-gallery .mini-hit,
  #home-view.mode-gallery .mini-tags-layer * { pointer-events: none !important; }

  /* display-switch button — fixed top-right (x from right, y from top), shows
     the glyph of the mode you'd switch TO. Styled like the Back/Play buttons
     (Default + Hover, Regular | Boxed + colors via the `disp` pill family). */
  .display-switch {
    position: fixed;
    top:   var(--disp-y, 28px);
    right: var(--disp-x, 28px);
    width:  var(--disp-size, 44px);
    height: var(--disp-size, 44px);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--disp-size, 44px) * 0.42);
    line-height: 1;
    cursor: pointer; user-select: none;
    z-index: 120;
    border-radius: var(--disp-radius, 0px);
    background-color: var(--disp-def-base, var(--bg));
    background-image: linear-gradient(var(--disp-def-bg, transparent), var(--disp-def-bg, transparent));
    border: var(--disp-def-bw, 1px) solid var(--disp-def-border, var(--border));
    color: var(--disp-def-text, var(--text));
    /* border-radius is ALWAYS in the transition list (so a value change is always
       animatable); its duration is 0s normally — instant for live slider drags —
       and set to the real value by setDisplayMode() only during a mode toggle, so
       the corner radius eases buttery + BOTH ways between the list/gallery radii. */
    transition: background 0.15s, border-color 0.15s, color 0.15s,
                border-radius var(--disp-rad-dur, 0s) var(--disp-rad-ease, cubic-bezier(0, 0, .1, 1));
  }
  .display-switch:hover {
    background-color: var(--disp-hov-base, var(--bg));
    background-image: linear-gradient(var(--disp-hov-bg, transparent), var(--disp-hov-bg, transparent));
    border-width: var(--disp-hov-bw, 1px);
    border-color: var(--disp-hov-border, var(--highlight));
    color: var(--disp-hov-text, var(--highlight));
  }
  /* the switch only belongs to the home view */
  #project-view ~ * .display-switch { }

  /* ── GALLERY DISPLAY ──
     Multi-column row-major grid. The stage scrolls vertically; the grid block
     is centered horizontally (+ X offset) and offset from the top by Y. */
  .gallery-stage {
    position: fixed;
    top: 0;
    /* anchor against the ACTUAL panel width (--left-w) so the stage's left edge
       tracks the toolbar: when the toolbar collapses (--left-w → 0) the stage
       expands to fill the freed space and the tiles enlarge (scaleFactor also
       measures against --left-w) to keep the same relative size + margins to the
       main content section. When NOT collapsed --left-w === --panel-w, so the
       grid scales proportionally as before. Transitioned to glide with the
       panel's own slide rather than snapping at the collapse threshold. */
    left: var(--left-w, var(--panel-w));
    right: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    z-index: 4;
  }
  /* transition `left` ONLY across the collapse (class toggle), NOT during
     continuous width resizing — otherwise every resize step lags behind by the
     transition duration. While expanded (no .tb-collapsed) the base rule has no
     transition, so the stage tracks --left-w instantly as the window scales. */
  .site.tb-collapsed .gallery-stage {
    transition: left 0.42s cubic-bezier(.4, 0, .2, 1);
  }
  /* transition `left` ONLY across the collapse (class toggle), NOT during
     continuous width resizing — otherwise every resize step lags behind by the
     transition duration. While expanded (no .tb-collapsed) the base rule has no
     transition, so the stage tracks --left-w instantly as the window scales. */
  .site.tb-collapsed .gallery-stage {
    transition: left 0.42s cubic-bezier(.4, 0, .2, 1);
  }
  /* ROW order scrolls HORIZONTALLY (the grid extends to the right); column
     order scrolls vertically (the base rule above). */
  .gallery-stage.stage-row { overflow-x: auto; overflow-y: hidden; }
  .gallery-stage::-webkit-scrollbar { display: none; }
  .gallery-grid {
    position: absolute;
    display: flex;
    align-items: flex-start;
    top: var(--gal-y, 150px);
    left: 50%;
    /* JS sets flex-direction, gap, width; we center the block about the stage
       (+ the X offset tweak) in COLUMN order. */
    transform: translateX(-50%) translateX(var(--gal-x, 0px));
  }
  /* ROW order — flex column of rows, anchored top-left, scrolls horizontally. */
  .gallery-grid.order-row {
    flex-direction: column;
    align-items: flex-start;
    padding-right: 80px;
    top: var(--galr-y, 120px);
    left: var(--galr-x, 40px);
    transform: none;
  }
  .gal-item {
    cursor: pointer;
    position: relative;
  }
  .gal-row { display: flex; flex-direction: row; align-items: var(--gal-row-align, flex-start); }
  /* the row holding an open info panel is raised so its text + tags paint ABOVE
     neighbouring thumbnails when offsets make them overlap. */
  .gal-row.has-info { position: relative; z-index: 30; }
  /* per-tile spacing (NOT flex gap) so an inserted 0-size info panel adds no
     space until it animates open. */
  .gal-row > .gal-item { margin-right: var(--gal-cgap, 0px); }
  .gal-row > .gal-item:last-child { margin-right: 0; }

  /* EVERY-OTHER row/column OFFSETS. The off-row / off-col classes are stamped
     at build time (stable through info-panel insertion); the offset amounts are
     CSS vars so the sliders update live. Implemented as position:relative
     top/left — NOT transform — because a transform (even 0px) creates a
     stacking context on half the tiles/columns, which would trap their info
     text (.gal-info z-index) and let neighbouring thumbnails paint OVER it.
     Relative offsets are visually identical (no layout shift) and create no
     stacking context. */
  .order-row .gal-row.off-row  { position: relative; left: var(--galr-row-offset, 0px); }
  .order-row .gal-item.off-col { top: var(--galr-col-offset, 0px); }

  /* HOVER INFO — the project title + mini + tags appear CENTERED OVER the
     hovered thumbnail (no sliding / reflow). Absolutely fills the tile, fades
     in, and sits above neighbouring tiles. */
  .gal-info {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: var(--gal-info-justify, center);
    padding: 10px;
    box-sizing: border-box;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transform: translate(calc(var(--gal-info-x, 0px) + var(--gi-px, 0px)), calc(var(--gal-info-y, 0px) + var(--gi-py, 0px)));
    transition: opacity 0.25s ease;
  }
  .gal-info.show { opacity: 1; }
  /* NOTE: no z-index on .gal-item.has-info — the item must NOT become a
     stacking context, so each .gal-info's own z-index:20 competes globally and
     info TEXT always paints above every thumbnail (z:auto), including in
     always-show mode where every tile has an info block. */
  /* Full-width block so text-align governs EVERY line deterministically. A
     shrink-to-fit inner would size to its widest child (the title) and then a
     title WIDER than the tile (a big single word like "Consumania") can't wrap,
     so it defines an oversized block and the flex/justify alignment gets
     ignored by browser overflow-safety — the word ends up centred and spilling
     both edges. With width:100% the block is the tile width and text-align:right
     puts the word's END at the right edge (overflow spills LEFT); left/centre
     behave symmetrically. Tags (a flex row) use justify-content to match. */
  .gal-info-inner {
    width: 100%;
    min-width: 0;
    text-align: var(--gal-info-align, center);
  }
  .gal-info-title, .gal-info-desc { max-width: none; }
  /* gallery-specific type sizes (independent of the list display's h1/mini/tag
     sizes); weight/leading/tracking/colour still track the shared type vars. */
  .gal-info-title {
    font-size:      var(--gal-title-size, var(--h1-size));
    font-weight:    var(--h1-weight);
    line-height:    var(--gal-title-leading, var(--h1-leading));
    letter-spacing: var(--h1-tracking);
    color: var(--title-color, var(--text));
    margin-bottom: 8px;
    text-wrap: pretty;
  }
  .gal-info-desc {
    font-size:      var(--gal-mini-size, var(--mini-size));
    font-weight:    var(--mini-weight);
    line-height:    var(--mini-leading);
    letter-spacing: var(--mini-tracking);
    color: var(--mini-color, var(--text));
    margin-bottom: 12px;
    text-wrap: pretty;
  }
  .gal-info-tags {
    display: flex; flex-wrap: wrap; gap: var(--tag-gap, 6px);
    justify-content: var(--gal-info-justify, center);
  }
  .gal-info .tag-pill { font-size: var(--gal-tag-size, var(--tags-size)); }
  .gal-thumb {
    position: relative;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: var(--gal-inactive-overflow, hidden);
    transition: transform 0.3s cubic-bezier(.2,.7,.2,1);
    transform-origin: center center;
    box-sizing: border-box;
  }
  .gal-item:hover .gal-thumb { transform: scale(var(--gal-hover-scale, 1.05)); }
  /* "Show hover scale" preview — blows EVERY thumb up to its hovered size even
     while inactive, for quick composition testing. Toggled on #gallery-stage
     (a stable ancestor) so a grid rebuild doesn't wipe the class. Both orders
     share the same hover-scale value, so one var covers them. */
  #gallery-stage.preview-hover-scale .gal-thumb { transform: scale(var(--gal-hover-scale, 1.05)); }
  .gal-thumb-media {
    display: block;
    width: 100%;
    height: 100%;
    /* base transition so the dim/blur eases in BOTH directions on hover */
    transition: filter 0.3s ease, opacity 0.3s ease;
  }
  /* canvas: VIDEO thumbnails render as a <canvas> mirroring a hidden pooled
     <video> (see gallery-display.js) — a canvas paints in the normal pipeline
     exactly like an <img>, so the edge-shape masks behave identically for
     mp4/gif/jpg with none of the composited-video 1px seam artifacts. */
  .gal-thumb-media img,
  .gal-thumb-media video,
  .gal-thumb-media canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
  }
  /* Isolate the video-canvas tile onto its OWN compositing layer: each
     drawImage otherwise invalidates the shared page layer, forcing every
     masked thumbnail to re-rasterise per frame — which shimmers/flickers in
     scaled-down embedded views (fine when hardware-composited fullscreen).
     translateZ on the WRAPPER (not the canvas) keeps the mask on the canvas
     rasterising in the normal paint path — no composited-texture edge seam. */
  .gal-thumb-media:has(canvas) { transform: translateZ(0); }
  /* THREE hover states, resolved with :has() so we can tell "nothing hovered"
     (every tile INACTIVE) apart from "a tile is hovered" (the hovered one gets
     HOVERED, all OTHERS get UNSELECTED).

     ANTI-FLICKER: the per-state look is delivered as TWO cheap properties.
     (1) filter — applyTweaks emits the literal `none` whenever that state has
         no blur and saturation 1, so an untouched gallery has NO filter at all.
         A non-none filter forces every tile into its own paint-isolated group,
         and those get re-rasterised as tiles cross the scroller's edge.
     (2) edge shape — a plain border-radius PERCENTAGE instead of the old SVG
         mask-image. The mask was a gaussian-filtered SVG that Chrome had to
         rasterise once per tile SIZE and re-rasterise whenever it evicted the
         cache — the tile paints unmasked/blank for that frame, which is exactly
         the "random thumbnails blink" symptom. With the solid centre fixed at
         100% the mask never feathered anyway, so a border-radius (which img,
         video and canvas all clip to) is pixel-identical and nearly free. */
  .gallery-grid:not(:has(.gal-item:hover)) .gal-item .gal-thumb-media {
    filter: var(--gal-inactive-filter, none);
    opacity: var(--gal-inactive-opacity, 1);
  }
  .gallery-grid:has(.gal-item:hover) .gal-item:not(:hover) .gal-thumb-media {
    filter: var(--gal-unsel-filter, none);
    opacity: var(--gal-unsel-opacity, 1);
  }
  .gal-item:hover .gal-thumb-media {
    filter: var(--gal-hover-filter, none);
    opacity: var(--gal-hover-opacity, 1);
  }
  /* EDGE SHAPE — 0% = sharp rectangle, 50% = ellipse (matches the old mask). */
  .gal-thumb-media > * { transition: border-radius 0.3s ease; }
  .gallery-grid:not(:has(.gal-item:hover)) .gal-item .gal-thumb-media > * { border-radius: var(--gal-inactive-radius, 0%); }
  .gallery-grid:has(.gal-item:hover) .gal-item:not(:hover) .gal-thumb-media > * { border-radius: var(--gal-unsel-radius, 0%); }
  .gal-item:hover .gal-thumb-media > * { border-radius: var(--gal-hover-radius, 0%); }
  .gallery-grid:has(.gal-item:hover) .gal-item:not(:hover) .gal-thumb { overflow: var(--gal-unsel-overflow, hidden); }
  /* HOVERED — its own treatment (mirrors the inactive dropdown): dim/saturate/
     blur the media + optional tint, so the centered info text reads over it. */
  .gal-item:hover .gal-thumb { overflow: var(--gal-hover-overflow, hidden); }
  /* coloured tint overlay (multiply, like the list). mix-blend-mode forces a
     blended compositing pass on EVERY tile whether or not it's visible, so the
     layer is switched OFF entirely when all three tint strengths are 0. */
  .gal-thumb::after {
    content: "";
    display: var(--gal-tint-display, block);
    position: absolute;
    inset: 0;
    background: var(--gal-inactive-tint, transparent);
    mix-blend-mode: multiply;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .gallery-grid:not(:has(.gal-item:hover)) .gal-item .gal-thumb::after {
    opacity: var(--gal-inactive-tint-strength, 0);
    background: var(--gal-inactive-tint, transparent);
  }
  .gallery-grid:has(.gal-item:hover) .gal-item:not(:hover) .gal-thumb::after {
    opacity: var(--gal-unsel-tint-strength, 0);
    background: var(--gal-unsel-tint, var(--gal-inactive-tint, transparent));
  }
  .gal-item:hover .gal-thumb::after {
    opacity: var(--gal-hover-tint-strength, 0);
    background: var(--gal-hover-tint, var(--gal-inactive-tint, transparent));
  }

  .list-stage {
    position: fixed;
    top: 0;
    left: var(--left-w);
    right: 0;
    height: 100vh;
    overflow: hidden;
    cursor: default;
    user-select: none; -webkit-user-select: none;
    background: var(--bg);
  }

  /* the column is positioned by JS (left + width); aligned via flex-direction */
  .list-column {
    position: absolute;
    top: 0;
    height: 100%;
    pointer-events: none; /* clicks pass through gaps */
  }

  .list-track {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    will-change: transform;
  }

  .list-item {
    width: 100%;
    display: flex;
    /* alignment within column set via JS: justify-content */
    pointer-events: none;
  }
  /* inactive thumbs that won't respond to a click show the normal cursor:
     Inactive thumbnails off, or a go-to-project trip in flight (nav locked) */
  html.list-inactive-inert .list-item:not(.is-active) .list-thumb,
  html.nav-locked .list-item .list-thumb { cursor: default; }
  .list-thumb {
    pointer-events: auto;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    transition: transform var(--list-hover-duration, 0.35s) cubic-bezier(.2,.7,.2,1),
                opacity 0.3s ease,
                filter 0.3s ease;
    /* page-bg (not the grey placeholder) so transparent PNG areas read as the
       page background, not a grey box */
    background: var(--bg);
    /* Combined transform supports BOTH hover scale AND neighbour-shift
       (set as a CSS var by JS when an adjacent item is hovered). */
    transform: translateY(var(--list-thumb-shift, 0px)) scale(1);
    box-sizing: border-box;
  }
  .list-thumb-media {
    display: block;
    width: 100%;
    height: 100%;
    /* transition lives on the BASE rule (not :not(.is-active)) so the blur /
       opacity / saturation animate in BOTH directions as a thumb scrolls into
       and out of the active centre — not just on the inactive state. */
    transition: filter 0.3s ease, opacity 0.3s ease;
  }
  .list-thumb img,
  .list-thumb video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    transition: filter 0.3s ease, opacity 0.3s ease;
  }
  /* Coloured tint overlay (for inactive thumbs). multiply blend darkens
     toward the tint colour; pure black tint at strength 1 ≈ dim toward black,
     a grey/colour tint adds a hue. opacity transitions with state. */
  .list-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--list-inactive-tint, transparent);
    mix-blend-mode: multiply;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 1;
  }
  .list-thumb:hover {
    transform: translateY(var(--list-thumb-shift, 0px)) scale(var(--list-hover-scale, 1.06));
    z-index: 3;
  }
  /* dimming + saturation + tint for inactive (non-centered) thumbs.
     Opacity & saturation apply to the WHOLE thumb (including its bg) so an
     opacity of 0 makes the entire tile invisible (not just the image inside).
     BLUR is applied to the inner media (not the thumb) so the thumb's
     overflow:hidden CLIPS the blur halo to the tile box — a filter on the thumb
     itself isn't clipped by its own overflow and bleeds out as a separate
     (flickering, for video) layer. */
  .list-item:not(.is-active) .list-thumb {
    /* NO filter and NO opaque bg here: a filter on the thumb would clip the
       child wrapper's blur halo to a rectangle (hard edge), and an opaque bg
       rectangle would seam against the bleeding halo. All inactive effects live
       on the .list-thumb-media wrapper instead. */
    background: transparent;
    overflow: var(--list-inactive-overflow, hidden);
  }
  /* SEAMLESS EXTENDED BLUR. Order matters: FEATHER the media's alpha first (mask
     on the media), then blur + desaturate + dim the WRAPPER around it. CSS runs
     a filter before a mask on the SAME element, so blurring the media directly
     leaves a hard alpha step at the image edge. Masking the media and filtering
     its PARENT runs the blur over the already-soft-edged image — one continuous
     seamless blob extending out from the edges, with blur + saturate sharing a
     SINGLE filter region (no halo clipping). Re-rendered every frame → animated
     GIF/video stay seamless. */
  .list-item:not(.is-active) .list-thumb-media {
    filter: saturate(var(--list-inactive-saturation, 1)) blur(var(--list-inactive-blur, 0px));
    opacity: var(--list-inactive-opacity, 1);
  }
  .list-item:not(.is-active) .list-thumb-media img,
  .list-item:not(.is-active) .list-thumb-media video {
    /* Shape-morphing alpha mask, built in applyTweaks (--list-inactive-mask):
       an SVG rounded-rect with a gaussian-feathered edge. Corner radius morphs
       the silhouette from ELLIPSE (radial) to RECTANGLE; the solid centre size
       comes from "Sharp core". Smoothly feathered (no hard step), then the
       wrapper blur smooths it further → seamless at any shape. */
    -webkit-mask-image: var(--list-inactive-mask, none);
            mask-image: var(--list-inactive-mask, none);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center;  mask-position: center;
    -webkit-mask-size: 100% 100%;   mask-size: 100% 100%;
  }
  .list-item:not(.is-active) .list-thumb::after {
    opacity: var(--list-inactive-tint-strength, 0);
  }
  .list-item:not(.is-active) .list-thumb:hover {
    opacity: 1;
    filter:  saturate(1);
  }
  /* hovered inactive thumb: clear blur/dim + feather mask */
  .list-item:not(.is-active) .list-thumb:hover .list-thumb-media {
    filter: saturate(1) blur(0px);
    opacity: 1;
  }
  .list-item:not(.is-active) .list-thumb:hover .list-thumb-media img,
  .list-item:not(.is-active) .list-thumb:hover .list-thumb-media video {
    -webkit-mask-image: none;
            mask-image: none;
  }
  .list-item:not(.is-active) .list-thumb:hover::after {
    opacity: 0;
  }
  .list-item.is-active .list-thumb { opacity: 1; }

  #list-count {
    position: fixed;
    bottom: 16px; left: calc(var(--left-w) + 50%);
    transform: translateX(-50%);
    font-size:      var(--tags-size);
    font-weight:    var(--tags-weight);
    line-height:    var(--tags-leading);
    letter-spacing: var(--tags-tracking);
    color: var(--text-faint);
    pointer-events: none;
    z-index: 4;
    white-space: nowrap;
  }
  #list-count.hidden { display: none; }

  /* ── CENTER MARKER GLYPH ──
     Fixed at the vertical middle of the stage, positioned just left of the
     active thumbnail's left edge. JS sets `left:` each time the centered item
     changes (because thumb widths vary per project). */
  .list-marker {
    position: absolute;
    top: calc(50% + var(--list-column-y, 0px));
    /* Glyph Y offset (--marker-glyph-y): nudges the CHARACTER only — glyphs
       like › don't sit in the vertical middle of their own box. The connector
       line subtracts the same offset (updateMarkerLine), so it stays on the
       active row's centre and the glyph is moved onto it. */
    /* Rotation (--marker-rot, quarter turns) spins the glyph about its own
       centre — e.g. an up-pointing 🢑 turned 90° to point right. The centre
       doesn't move, so the connector line still meets it; positionMarker()
       uses the ROTATED width for the gap from the thumb. */
    transform: translate(var(--marker-glyph-x, 0px), calc(-50% + var(--marker-glyph-y, 0px))) rotate(var(--marker-rot, 0deg));
    font-size: var(--marker-size, 14px);
    line-height: 1;
    color: var(--marker-color, #111);
    pointer-events: none;
    user-select: none;
    z-index: 4;
    opacity: 0;
    /* no transition on `left` — it's repositioned every animation frame to
       track the active thumb's live rect (including hover scale), and a CSS
       transition would lag the chase */
    transition: opacity 0.2s ease;
  }
  .list-marker.is-visible { opacity: 1; }

  /* ── MARKER CONNECTOR LINE ──
     Optional 1px rule joining the marker to the left/right edge of the active
     title in the title stack. JS sets left/width/top each frame so it tracks
     both the marker's horizontal glide and the title stack's position. */
  .list-marker-line {
    position: fixed;
    height: 0;
    /* Line → Thickness / Color (falls back to the glyph colour) */
    border-top: var(--marker-line-w, 1px) solid var(--marker-line-color, var(--marker-color, #111));
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    transition: opacity 0.2s ease;
  }
  .list-marker-line.is-visible { opacity: 1; }

  /* ── SCROLL MARKERS ──
     Two glyph affordances anchored to the bottom of the stage, horizontally
     centered over the thumbnail column (+ per-marker X offset). The DOWN
     marker fades in only when the list is scrolled fully to the TOP; the UP
     marker only when scrolled fully to the BOTTOM. JS (list-gallery) sets
     left/bottom each frame and toggles .is-visible / .anim. */
  .scroll-marker {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    font-size: var(--scroll-marker-size, 14px);
    line-height: 1;
    color: var(--marker-color, #111);
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .scroll-marker.is-visible { opacity: 1; }
  /* COLOURS (Scroll markers → Project list / Home page top → Color + Hover
     color; each falls back to the center marker colour as before). The list
     pair is clickable while shown — down / up steps one project (list-gallery.js),
     so its hover colour means something. */
  #scroll-marker-down, #scroll-marker-up {
    color: var(--smk-list-color, var(--marker-color, #111));
    transition: opacity 0.25s ease, color 0.15s ease;
  }
  #scroll-marker-down.is-visible, #scroll-marker-up.is-visible { pointer-events: auto; cursor: pointer; }
  #scroll-marker-down.is-visible:hover, #scroll-marker-up.is-visible:hover {
    color: var(--smk-list-hover, var(--smk-list-color, var(--marker-color, #111)));
  }
  #reel-scroll-marker {
    color: var(--smk-reel-color, var(--marker-color, #111));
    transition: opacity 0.25s ease, color 0.15s ease;
  }
  #reel-scroll-marker.is-visible:hover {
    color: var(--smk-reel-hover, var(--smk-reel-color, var(--marker-color, #111)));
  }
  .scroll-marker-inner { display: inline-block; }
  .scroll-marker.anim .scroll-marker-inner {
    animation: scrollMarkerYoyo var(--smk-dur, 1.4s) ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-marker.anim .scroll-marker-inner { animation: none; }
  }
  @keyframes scrollMarkerYoyo {
    0%, 100% { transform: translateY(calc(-1 * var(--smk-amt, 3px))); }
    50%      { transform: translateY(var(--smk-amt, 3px)); }
  }

  /* ── LEFT-PANEL TITLE STACK ──
     Stays VERTICALLY CENTERED in the viewport (aligned with the center
     marker and centered thumb), regardless of viewport size. Floats as an
     absolute layer over the left panel between the bio and the filters.
     Uses a mask gradient for vertical fade so we DON'T need overflow:hidden
     — that way the horizontal blur halos on titles can extend slightly
     beyond the panel padding without getting clipped. */
  /* ── LEFT-PANEL TITLE STACK ──
     position:fixed so blur halos aren't clipped by .left's overflow:auto.
  /* ── TITLE STACK ──
     Now lives in the MAIN CONTENT area (right of the left panel), vertically
     centered in the viewport so it aligns with the center-selected thumbnail.
     Horizontally aligned with the mini description by default (X from the
     content edge). Width matches the mini description so its left/center/right
     text alignment shares the same box. Shows the center title plus 3 above
     and 3 below (7 rows). */
  .lp-title-stack {
    position: fixed;
    left: calc(var(--left-w) + var(--title-stack-x, 36px));
    /* zero-width anchor: rows are max-content and never clip, so the title
       text width is UNLIMITED and fully independent of the mini description.
       Per-row transform handles left/center/right alignment about this x. */
    width: 0;
    top: calc(50% + var(--title-stack-offset, 0px));
    transform: translateY(-50%);
    height: calc(7 * var(--title-stack-row-h, 44px));
    /* stack itself has no pointer events; rows opt back in (so the gaps
       between rows don't capture clicks meant for buttons below).
       No mask: fade is purely JS-driven via per-row opacity — that way
       :hover can override opacity cleanly without fighting a mask gradient. */
    pointer-events: none;
    z-index: 6;
  }
  .lp-title-row {
    position: absolute;
    /* anchored at the stack's x; alignment is applied via translateX in JS so
       the row can be max-content (unlimited text) instead of a fixed box. */
    left: 0;
    top: 50%;
    width: max-content;
    height: var(--title-stack-row-h, 44px);
    line-height: var(--title-stack-row-h, 44px);
    font-size:      var(--h1-size);
    font-weight:    var(--h1-weight);
    letter-spacing: var(--h1-tracking);
    color: var(--title-color, var(--text));
    white-space: nowrap;
    will-change: transform, opacity, filter;
    /* state values are pushed by JS as CSS custom props — :hover can override
       them by setting opacity/filter !important. transform stays inline since
       it's per-row Y and never overridden. */
    opacity: var(--row-opacity, 1);
    filter:  var(--row-filter, none);
    pointer-events: auto;
    cursor: pointer;
  }
  /* SIZE BY DISTANCE (Project titles → Upper / lower titles → 1st/2nd/3rd size):
     portfolio.js appends scale(s) to each row's per-frame transform; the origin
     tracks the title alignment so left-aligned titles shrink toward their left
     edge (right → right edge, center → centre). */
  .lp-title-row { transform-origin: var(--title-origin, left center); }
  /* inner span carries the hover enlarge so it's independent of the row's
     per-frame translate transform. Always scales from its CENTRE (it used to
     follow the alignment, so a left-aligned title grew to the right only). */
  .lp-title-inner {
    display: inline-block;
    transform-origin: center center;
    transition: transform 0.16s ease, color 0.16s ease;
    will-change: transform;
  }
  /* Only the CENTERED (active) title enlarges + recolors on hover. */
  /* --title-hover-shift: set by portfolio.js (hover edge guard) — pushes the
     enlarged title right just enough that its centred growth never crosses
     into the toolbar, which would paint over (cut off) its left edge. */
  .lp-title-row.is-centered:hover .lp-title-inner {
    transform: translateX(var(--title-hover-shift, 0px)) scale(var(--title-hover-scale, 1.08));
    color: var(--title-hover-color, inherit);
  }
  /* Hovering the mini description reads as hovering the centered title. */
  #home-view.mini-hover .lp-title-row.is-centered .lp-title-inner {
    transform: translateX(var(--title-hover-shift, 0px)) scale(var(--title-hover-scale, 1.08));
    color: var(--title-hover-color, inherit);
  }
  #home-view.blend-invert.title-noblend-hover.mini-hover .lp-title-stack { mix-blend-mode: normal; }
  #home-view.blend-invert.title-noblend-hover.mini-hover .lp-title-row {
    color: var(--title-color, var(--text, #111));
  }
  /* Hover an inactive (blurred / faded) title — transition to fully visible
     and let the user click through. The transition only fires on the hover
     change since the default state has no transition (per-frame JS updates
     wouldn't lag behind in that case). */
  .lp-title-row:hover {
    opacity: 1 !important;
    filter:  none !important;
    transition: filter 0.25s ease, opacity 0.25s ease;
  }

  /* =====================================================================
     ── PLAYGROUND GALLERY ──
     Draggable, multi-row, auto-scrolling thumbnail field — used for projects
     that declare `playgroundImages`. Repurposed from the original home gallery.
     ===================================================================== */
  .pg-viewport {
    position: relative;
    width: 100%; height: 100vh;
    overflow: hidden;
    cursor: grab;
    user-select: none; -webkit-user-select: none;
  }
  .pg-viewport.is-dragging { cursor: grabbing; }
  .pg-outer {
    position: absolute; top: 0; left: 0;
    width: 100%;
    will-change: transform;
  }
  .pg-track {
    position: absolute; top: 0; left: 0;
    display: flex;
    align-items: center;
    will-change: transform;
  }
  .pg-item {
    flex-shrink: 0;
    display: flex; flex-direction: column;
    cursor: pointer;
    position: relative;
    transition: transform var(--pg-hover-duration, 0.3s) ease;
  }
  /* MAKE ROOM (Playground gallery → Push strength / Push area): radial
     falloff push — playground-gallery.js writes an inline translate on the
     tiles around the hovered one (on hover change only); this transition does
     the motion. The hovered tile's track (.pp-on) paints above the others. */
  .pg-row-wrap.pp-on, .pg-item.is-hover { z-index: 2; }
  .pg-ax-y .pg-track { align-items: center; }
  .pg-viewport.is-dragging .pg-item { transition: none; }
  /* one-frame snap for a push re-applied across a track wrap (visually identical) */
  .pg-viewport.pg-snap .pg-item { transition: none !important; }
  /* UNSELECTED CLIPS (Playground gallery → Unselected clips): while a clip is
     hovered (.pg-has-hover, set by playground-gallery.js) every OTHER tile gets
     --pg-unsel-filter (saturate / blur; the literal none when neutral so no
     filter layer exists) + --pg-unsel-opacity. */
  .pg-has-hover .pg-item:not(.is-hover):not(.is-held) .pg-cell { filter: var(--pg-unsel-filter, none); opacity: var(--pg-unsel-opacity, 1); }
  /* DRAG ARROWS (Playground gallery → Drag arrows): one glyph centred on each
     edge of the playground, inset --pg-arrow-dist. The glyph is drawn pointing
     UP and rotated per side. html[data-pg-arrows] = off | all | horizontal
     (left + right) | vertical (top + bottom), set by applyTweaks. */
  .pg-arrows { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .pg-arrow {
    position: absolute;
    width: 1em; height: 1em;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--pg-arrow-size, 20px);
    line-height: 1;
    color: var(--pg-arrow-color, var(--marker-color, #111));
    user-select: none; -webkit-user-select: none;
  }
  .pg-arrow::before { content: var(--pg-arrow-glyph, "↑"); display: block; }
  .pg-arrow-t { top: var(--pg-arrow-dist, 24px); left: 50%; transform: translateX(-50%); }
  .pg-arrow-b { bottom: var(--pg-arrow-dist, 24px); left: 50%; transform: translateX(-50%) rotate(180deg); }
  .pg-arrow-l { left: var(--pg-arrow-dist, 24px); top: 50%; transform: translateY(-50%) rotate(-90deg); }
  .pg-arrow-r { right: var(--pg-arrow-dist, 24px); top: 50%; transform: translateY(-50%) rotate(90deg); }
  html[data-pg-arrows="off"] .pg-arrows { display: none; }
  html[data-pg-arrows="horizontal"] .pg-arrow-t,
  html[data-pg-arrows="horizontal"] .pg-arrow-b,
  html[data-pg-arrows="vertical"] .pg-arrow-l,
  html[data-pg-arrows="vertical"] .pg-arrow-r { display: none; }
  /* ONLY WHILE HOLDING (Drag arrows → Only while holding, html.pg-arrows-drag):
     hidden until the playground is pressed and HELD (.is-dragging, set on
     mousedown / touchstart by playground-gallery.js) — moving or not; fades
     out on release. */
  html.pg-arrows-drag .pg-arrows { opacity: 0; transition: opacity 0.35s ease; }
  html.pg-arrows-drag .pg-viewport.is-dragging .pg-arrows { opacity: 1; transition-duration: 0.18s; }
  .pg-cell {
    flex-shrink: 0;
    display: block;
    position: relative;
    transform-origin: center center;
    transition: transform var(--pg-hover-duration, 0.3s) ease, filter var(--pg-hover-duration, 0.3s) ease, opacity var(--pg-hover-duration, 0.3s) ease;
  }
  /* FADE BACK (Unselected clips → Fade back): the clip just left on a
     clip-to-clip swap (.pg-left, set briefly by playground-gallery.js) returns
     to its unselected look over --pg-unsel-fadeback instead. */
  .pg-item.pg-left .pg-cell {
    transition: transform var(--pg-hover-duration, 0.3s) ease, filter var(--pg-unsel-fadeback, 0.3s) ease-out, opacity var(--pg-unsel-fadeback, 0.3s) ease-out;
  }
  .pg-item.is-hover .pg-cell {
    transform: scale(var(--pg-hover-scale, 1.15));
  }
  .pg-item.is-held .pg-cell {
    transform: scale(var(--pg-hover-scale, 1.15));
    transition: none;
  }
  .pg-viewport.is-dragging .pg-item:not(.is-held) .pg-cell {
    transform: none !important;
    transition: none !important;
  }
  .pg-cell img,
  .pg-cell video,
  .pg-cell canvas {
    display: block;
    width: 100%; height: auto;
    pointer-events: none;
  }
  /* hidden shared source-video pool (the only real decoders) — kept tiny and
     near-invisible rather than display:none so the browser keeps decoding them
     for the canvas tiles to copy from. */
  .pg-vpool {
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 2px;
    overflow: hidden;
    opacity: 0.01;
    pointer-events: none;
    z-index: 0;
  }
  .pg-vpool video { width: 2px; height: 2px; }

  /* fullscreen overlay shown when a playground image is clicked */
  .pg-overlay {
    position: fixed;
    top: 0; left: var(--left-w);
    right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
  }
  .pg-overlay.is-active { pointer-events: auto; }
  /* EXPANDED CLIP background (Playground gallery → Expanded clip): blurs the
     gallery behind the expanded clip like the project-page lightboxes, then
     lays the page colour over it — Background blur → --pg-ov-blur, Background
     fade → --pg-ov-fade (0% = no veil, 100% = solid page colour). The whole
     backdrop fades in/out via opacity. Cursor = the shared close cursor. */
  .pg-overlay-backdrop {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--bg) var(--pg-ov-fade, 60%), transparent);
    -webkit-backdrop-filter: blur(var(--pg-ov-blur, 20px));
    backdrop-filter: blur(var(--pg-ov-blur, 20px));
    opacity: 0;
    transition: opacity 0.28s ease;
    cursor: var(--close-cursor, auto);
  }
  .pg-overlay.is-active .pg-overlay-backdrop { opacity: 1; }
  .pg-overlay-img {
    position: absolute;
    transform-origin: center center;
    transition: transform 0.42s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    overflow: hidden;   /* clip the media's 1px edge fringe (see below) */
  }
  .pg-overlay-img img,
  .pg-overlay-img video {
    display: block;
    /* overscan 1px on every edge (then clipped by the wrap's overflow:hidden):
       a transform-scaled <video> leaves a 1px dark compositing seam on its
       bottom/right edges — pushing the media 1px past the box hides it.
       cover keeps it filling with no letterbox. */
    position: relative; top: -1px; left: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    object-fit: cover;
  }

  /* ── PROJECT-PAGE IMAGE LIGHTBOX ──
     Click a content image to expand it centered, filling --lightbox-size of the
     viewport. The backdrop uses backdrop-filter to blur everything behind it and
     captures all pointer events, so nothing underneath is clickable while open. */
  .proj-block img { cursor: zoom-in; }
  .img-lightbox {
    position: fixed; inset: 0;
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
  }
  .img-lightbox.is-active { display: flex; }
  /* EXPANDED MEDIA background (Project page → Expanded media), shared by the
     image, local-video and rich-video lightboxes: Background blur → --lb-blur,
     Background fade → --lb-fade (page colour laid over the blurred page; 0% =
     none, 100% = solid). Was hard-coded 20 / 14 / 6px blur + 60%. Cursor over
     the backdrop (= "click to close") = --close-cursor (Close cursor). */
  .img-lightbox-backdrop {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--bg) var(--lb-fade, 60%), transparent);
    -webkit-backdrop-filter: blur(var(--lb-blur, 20px)) saturate(1.05);
    backdrop-filter: blur(var(--lb-blur, 20px)) saturate(1.05);
    opacity: 0;
    transition: opacity 0.3s ease;
    cursor: var(--close-cursor, auto);
  }
  .img-lightbox.is-active .img-lightbox-backdrop { opacity: 1; }
  .img-lightbox-img {
    position: relative;
    max-width:  calc(var(--lightbox-size, 0.75) * (100vw - var(--lb-left, 0px)));
    max-height: calc(var(--lightbox-size, 0.75) * 100vh);
    width: auto; height: auto;
    object-fit: contain;
    box-shadow: 0 24px 70px rgba(0,0,0,0.28);
    cursor: default;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.3s ease, transform 0.34s cubic-bezier(.2,.7,.2,1);
  }
  .img-lightbox.is-active .img-lightbox-img { opacity: 1; transform: scale(1); }

  /* freeze page scroll while an image is expanded */
  body.lightbox-open { overflow: hidden; }

  /* discourage casual saving of imagery site-wide: block image/video dragging
     and the iOS long-press callout (right-click menu itself is blocked in JS). */
  img, video { -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; }

  /* ── VIDEO LIGHTBOX ── enlarged embed in a centered overlay (custom enlarge
     button; works where native fullscreen is blocked, e.g. sandboxed iframes). */
  .video-lightbox {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
  }
  .video-lightbox.is-active { display: flex; }
  .video-lightbox-backdrop {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--bg) var(--lb-fade, 60%), transparent);
    backdrop-filter: blur(var(--lb-blur, 20px)); -webkit-backdrop-filter: blur(var(--lb-blur, 20px));
    opacity: 0; transition: opacity 0.3s ease;
    cursor: var(--close-cursor, auto);
  }
  .video-lightbox.is-active .video-lightbox-backdrop { opacity: 1; }
  .video-lightbox-frame {
    position: relative;
    /* width = the smaller of (size·vw) and the width that keeps height ≤ size·vh.
       Using a single min()-derived width with aspect-ratio guarantees the frame
       is ALWAYS exactly 16:9 — no max-height override can squash it wider and
       make Vimeo pillarbox (the old side-bars bug). */
    width: min(calc(var(--lightbox-size, 0.75) * (100vw - var(--lb-left, 0px))),
               calc(var(--lightbox-size, 0.75) * 100vh * 16 / 9));
    aspect-ratio: 16/9;
    background: #000;
    opacity: 0; transform: scale(0.96);
    transition: opacity 0.3s ease, transform 0.34s cubic-bezier(.2,.7,.2,1);
  }
  .video-lightbox.is-active .video-lightbox-frame { opacity: 1; transform: scale(1); }
  /* overscan the iframe 1px each side so sub-pixel rounding can't leave a black
     hairline (esp. along the bottom) between the iframe and the frame edge. */
  .video-lightbox-frame iframe {
    position: absolute; top: -1px; left: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    border: 0; display: block;
  }
  .video-lightbox-frame video { width: 100%; height: 100%; display: block; background: transparent; }
  /* local video: frame shrink-wraps the clip (no fixed aspect box) so the visible
     video bounds === the frame, and clicking any dim area outside it closes */
  .video-lightbox-frame.is-local {
    width: auto; height: auto; aspect-ratio: auto;
    max-width:  calc(var(--lightbox-size, 0.75) * (100vw - var(--lb-left, 0px)));
    max-height: calc(var(--lightbox-size, 0.75) * 100vh);
  }
  .video-lightbox-frame.is-local video {
    width: auto; height: auto;
    max-width:  calc(var(--lightbox-size, 0.75) * (100vw - var(--lb-left, 0px)));
    max-height: calc(var(--lightbox-size, 0.75) * 100vh);
  }
  .video-lightbox-close {
    position: absolute; top: -14px; right: -14px; z-index: 2;
    width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--text); color: var(--bg);
    border: none; border-radius: 50%; cursor: pointer;
    font-size: 18px; line-height: 1;
  }

  /* ── EXPAND OVER: whole window | main content ──
     Project page → Expanded media → Expand over (lbOver → html.lb-main) and
     Playground gallery → Expanded clip → Expand over (pgOvOver → html.pgov-window).
     WHOLE WINDOW: the overlay spans the viewport (the lightboxes' default inset:0;
     the playground overlay's left:0) — its backdrop blurs/fades EVERYTHING,
     toolbar included, and swallows every click behind it.
     MAIN CONTENT: the overlay starts at --left-w (the playground's default), so
     the toolbar is neither blurred nor blocked. --lb-left shrinks the lightboxes'
     max width to that area (their max sizes are size × (100vw − --lb-left)). */
  html.lb-main { --lb-left: var(--left-w); }
  html.lb-main .img-lightbox,
  html.lb-main .video-lightbox,
  html.lb-main .rv-lightbox { left: var(--left-w); }
  html.pgov-window .pg-overlay { left: 0; }
  /* MAIN-CONTENT mode while something is expanded (html.xm-main, kept in sync by
     the CLOSE CURSOR script): the toolbar's BACKGROUND is a close area too —
     close cursor over it, and a click there closes. Its buttons / links keep
     their own cursor (explicit pointer below for anything that would otherwise
     inherit the hidden-cursor 'none') and still work. */
  html.xm-main .left { cursor: var(--close-cursor, auto); }
  html.xm-main .left :is(a[href], button, [onclick], [role="button"], label, select, summary) { cursor: pointer; }
  html.xm-main .left :is(input, textarea) { cursor: text; }
</style>
</head>
<body>
<div class="site">

  <!-- ── LEFT PANEL ── -->
  <div class="left" id="left-panel"></div>

  <!-- ── RIGHT PANEL ── -->
  <div class="right">

    <!-- HOME = reel hero + vertical project list.
         TWO stacked fixed layers moved by js/home-intro.js: the reel is what
         you land on, and one scroll down slides it up while #home-projects
         (the whole project section) slides in from below and locks. -->
    <div id="home-view">
      <!-- REEL LAYER — fills the main content window edge to edge -->
      <div class="home-reel" id="home-reel">
        <div class="home-reel-box" id="home-reel-box">
          <!-- bounding box (size / position / border) — see .home-reel-bound -->
          <div class="home-reel-bound" id="home-reel-bound">
          <div class="home-reel-frame" id="home-reel-frame">
            <iframe id="home-reel-iframe" data-src="https://player.vimeo.com/video/1136277012?autoplay=1&muted=1&loop=1&byline=0&title=0&portrait=0&controls=0&dnt=1"
                    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            <!-- takes the hit-test off the cross-origin iframe so wheel/touch
                 reach the page — see .home-reel-shield -->
            <div class="home-reel-shield"></div>
            <!-- flat colour wash over the video (Colour overlay tweaks) -->
            <div class="home-reel-tint"></div>
          </div>
          <!-- bio-link hover media (created lazily by the bio-links script) —
               fills the BOUNDING BOX itself, not the 16:9 reel frame -->
          <div class="home-reel-alt" id="home-reel-alt"></div>
          </div>
        </div>
        <!-- DOWN-only scroll affordance, placed beneath the video by JS -->
        <div class="scroll-marker reel-marker" id="reel-scroll-marker"><span class="scroll-marker-inner"></span></div>
      </div>
      <!-- PROJECT SECTION — everything below moves as ONE layer. Children stay
           position:fixed; the wrapper's transform is their offset (published as
           --home-lift for the few JS writers of viewport y-coordinates). -->
      <div class="home-projects" id="home-projects">
      <!-- FULL-PAGE reel mode only: the toolbar's edge divider, re-homed into
           the sliding layer so it rises INTO place with the project section
           instead of standing over the full-bleed reel from the start. The
           panel's own border-right goes transparent in that mode. -->
      <div class="panel-edge-line" id="panel-edge-line"></div>
      <!-- display-mode switch (List ⇄ Gallery); shown only on the home view -->
      <button class="display-switch" id="display-switch" type="button" aria-label="Switch thumbnail display"></button>
      <div class="list-stage" id="list-stage">
        <div class="list-column" id="list-column">
          <div class="list-track" id="list-track"></div>
        </div>
        <div class="list-marker" id="list-marker"></div>
        <div class="list-marker-line" id="list-marker-line"></div>
      </div>
      <!-- GALLERY DISPLAY = multi-column row-major grid (alternate to the list) -->
      <div class="gallery-stage" id="gallery-stage">
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
      <!-- scroll-affordance markers: DOWN shows at the very top, UP at the very
           bottom. Used by BOTH displays (list + gallery), so they live as
           direct children of #home-view (position:fixed) instead of inside the
           list-stage — otherwise they'd vanish with the list-stage in gallery
           mode. Positioned/toggled each frame by the active display. -->
      <div class="scroll-marker" id="scroll-marker-down"><span class="scroll-marker-inner"></span></div>
      <div class="scroll-marker" id="scroll-marker-up"><span class="scroll-marker-inner"></span></div>
      <!-- title stack + filters: visually in the main content; kept OUT of the
           left-panel DOM so they DON'T slide off / hide when the toolbar
           collapses (they belong to the main content, not the toolbar). -->
      <div class="lp-title-stack" id="lp-title-stack"></div>
      <div class="lp-filter-block">
        <div class="filter-row" id="filter-list"></div>
      </div>
      <!-- mini description of the currently-centered project (BLENDED layer) -->
      <div class="mini-info" id="mini-info">
        <div class="mini-desc" id="mini-desc"></div>
      </div>
      <!-- tags sit in their OWN fixed layer (NOT blended) so the invert-over-
           images effect never touches them; JS positions it just under the
           mini description in renderMiniInfo/positionMiniTags. -->
      <div class="tag-row mini-tags-layer" id="mini-tags"></div>
      <!-- single hover/click hit area covering the description + tags block -->
      <div class="mini-hit" id="mini-hit"></div>
      </div>
    </div>

    <!-- PROJECT PAGE — two layouts, picked at openProject() time.
         "All work" back button now lives in the left panel (see setLeftProject). -->
    <div id="project-view" class="proj-page">
      <div id="proj-body"></div>
    </div>

    <!-- ABOUT -->
    <div id="about-view" class="about-view">
      <div class="about-text-col" id="about-text-col">
        <div class="about-bio" id="about-bio-text"></div>
      </div>
      <div class="about-reel-col" id="about-reel-col">
        <!-- Education / Awards / Conferences — rendered from window.ABOUT_META
             (or the aboutMeta Tweak) by renderAboutMeta() in applyTweaks. -->
        <div class="about-meta" id="about-meta"></div>
        <!-- ABOUT HERO IMAGE — moved between the two columns by applyTweaks
             (aboutHeroCol). Replaced the reel embed, which now lives on the
             home page as the scroll hero. -->
        <div class="about-hero" id="about-hero">
          <img class="about-hero-img" id="about-hero-img" src="assets/playground/Jumpdude-b.gif" alt="">
        </div>
      </div>
    </div>

    <!-- Playground fullscreen overlay (rendered on demand by playground-gallery) -->
    <div class="pg-overlay" id="pg-overlay">
      <div class="pg-overlay-backdrop" id="pg-overlay-backdrop"></div>
    </div>

    <!-- Project-page image lightbox — click an image to expand, click outside to close -->
    <div class="img-lightbox" id="img-lightbox">
      <div class="img-lightbox-backdrop"></div>
      <img class="img-lightbox-img" id="img-lightbox-img" alt="">
    </div>

    <!-- Project-page video lightbox — click an embed's enlarge button to expand -->
    <div class="video-lightbox" id="video-lightbox">
      <div class="video-lightbox-backdrop"></div>
      <div class="video-lightbox-frame" id="video-lightbox-frame">
        <button class="video-lightbox-close" type="button" aria-label="Close">&times;</button>
        <iframe id="video-lightbox-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
        <video id="video-lightbox-video" loop muted playsinline preload="metadata" style="display:none"></video>
      </div>
    </div>

    <!-- Rich-video enlarge overlay — the whole .rv-stage is moved in here -->
    <div class="rv-lightbox" id="rv-lightbox">
      <div class="rv-lb-backdrop"></div>
      <div class="rv-lb-frame"></div>
    </div>

  </div>

  <!-- Responsive toolbar drawer toggles (shown only on narrow windows) -->
  <button class="tb-toggle tb-expand" id="tb-expand" type="button" aria-label="Expand toolbar">☰</button>
