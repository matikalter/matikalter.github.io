  <button class="tb-toggle tb-minimize" id="tb-minimize" type="button" aria-label="Minimize toolbar">✕</button>
</div>

<!-- MOBILE APP — populated by js/mobile-app.js when window.__MOBILE__ is true.
     Hidden on desktop (CSS in css/mobile.css). -->
<div id="mobile-app"></div>
<div id="mobile-harness"></div>

<script>
  /* ===================================================================
     ★ EDITABLE SETTINGS — change values here, no code edits needed below.
     =================================================================== */

  /* ── Bios & logo ── */
  var BIO_SHORT     = "I'm a visual designer working in games, animation, and 2D/3D art.";
  var BIO_SHORT_ALT = '';

     Each item is [main, detail]: `main` renders in the body colour, `detail` in

  var ABOUT_META = [

      ['Canceled Culture', '- Exhibition, 2022'],
      ['LaCulture/Home', '- Exhibition, 2018']
    ] }
  ];

  /* The hover wordmark's colour comes from --highlight (Tweaks → Colors) via
     .logo-hover in CSS — do NOT put a `color:` in this style string, an inline
     style beats the stylesheet and pins the hover to one hard-coded value. */
  var LOGO = {
    idle:  { type: 'text', text: 'mati kalter', image: '', style: '' },
    hover: { type: 'text', text: 'mati kalter', image: '', style: '' }
  };

  /* =====================================================================
     ── DESIGN TOKENS ── (editable via the Tweaks panel — toggle from toolbar)
     ----------------------------------------------------------------------
     The block between EDITMODE markers below is the SINGLE SOURCE OF TRUTH
     for the visual system: fonts, colors, type scale, layout dimensions,
     and gallery behaviour. When you change anything in the Tweaks panel,
     this JSON is rewritten on disk so your changes survive reloads and
     stay in the file when you download / commit.

     You can also hand-edit the JSON here directly. Keep it valid JSON:
     double-quoted keys & string values, no comments, no trailing commas.
     ===================================================================== */
  /* note: `var` (not const) so this becomes window.TWEAKS, readable from
     the tweaks-app.jsx script that runs later in its own <script> block */

        "info": {
          "tags": [

            "game-design",
            "3d"
          ],
          "desc": "An interactive narrative experience that moves through liminal spaces, uncovering echoes of forgotten moments and those who came before - a symbolic reflection on cultural isolation, integration, and what we leave behind for others.\u003cbr>\u003cbr>Solo-developed as my master's thesis at The Royal Danish Academy - now a work in progress."
        },
        "flow": "strict",
        "blocks": {
          "slideshow|imprint-storyboards#0": {

          "image|Image Sequence_076_0000.jpg#0": {

          "image|Image Sequence_071_0000.jpg#0": {
            "place": "both"
          },
          "text|Experience Mapping#0": {
            "body": "I designed diagrams and storyboards to map the narrative structure: where tension builds, when the pace softens, and how agency shifts over time. Color and composition reinforce these beats, guiding the player's emotional journey.",
            "title": "Mapping the Narrative"
          },
          "text|Character Design#0": {
            "body": "Characters were shaped from primitive shapes with flexible proportions, aiming for non-descript forms that share a sense of relatability. Early 2D concepts guided 3D modelling in Blender and a grainy shader-based look achieved in Unity via custom lighting and procedural noise."
          },
          "image|CharacterLineup.jpg#0": {
            "size": 200,
            "hidden": true
          },
          "image|Sprites-3-PO.jpg#0": {
            "size": 60,
            "hidden": true
          },
          "text|Form Follows Feeling#0": {
            "title": "Environments and Interactions",
            "body": "Scenes shift between monotony and suspense, limited agency and sudden choice, isolation and integration. Mechanics with clear affordances and a shifting scale of spaces and camera angles, from distant wide shots to intimate over-the-shoulder, were chosen to reinforce this cycle - mirroring tensions between individual and collective identity."
          },
          "image|ScenesMechanicsCompareDiagram.jpg#0": {
            "spaceAbove": 50
          }

      "consumania": {
        "info": {
          "desc": "Step into a futuristic mega-mart and stick to your shopping list... or spiral into unstoppable shopping madness!\n\u003cbr>\u003cbr>\nI art directed and developed Consumania at the Royal Danish Academy - shaping its visual identity, guiding artists, modelling 3D assets, and building the systems behind the technical mayhem."
        },
        "flow": "strict",
        "blocks": {
          "image|Image-Sequence_021_0000.jpg#0": {
            "place": "left"
          },
          "image|Image-Sequence_052_0000.jpg#0": {
            "place": "right"
          },
          "text|Plastic is Fantastic#0": {
            "body": "Consumania's dystopic consumeristic aesthetic is built around toys, candy, and plastic - round forms and saturated colors that feel both irresistible and overwhelming. I led the visual direction while modelling key characters, supermarket items, and modular furniture under a cohesive plastic formula, which guided team members who created additional assets and city-scale props."
          },
          "text|Expanding the World#0": {
            "body": "The vision for the outer world was a retro-futuristic Copenhagen, with Danish landmarks translated into playfully recognizable forms. While the team explored 2D concepts for satirical signs, vehicles, and buildings, I curated them for 3D production to ensure a cohesive and intentionally absurd world."
          },
          "text|Development#0": {
            "body": "I built the game's signature mechanic with Unity's visual scripting: a Katamari-style rolling ball that grows with each impulse buy. The system continuously detects and absorbs items, filtering out oversized ones to maintain steady growth, ensuring the chaos feels wild but stays readable."
          },
          "text|Guiding the Emotion#0": {
            "title": "Guiding Emotions",
            "body": "After mapping out our intended emotional arc, we tested it using facial and electro dermal analysis (FACS\/GSR), measuring real player reactions. This confirmed spikes in excitement, especially at the supermarket breakout! As Art Director, I tuned color, composition, and visual pacing during such emotional peaks, making sure they amplified the experience we wanted players to have."
          }
        },

          "desc": "At \u003ca href=\"https:\/\/www.dadiu.dk\/games\/bloom\" target=\"_blank\" rel=\"noopener\">DADIU,\u003c\/a> I art directed Bloom - a musical puzzle game about planting flowers on desolate planets. I guided 3D artists and shaped the visual language of characters, flora, and shader driven environments.\n\u003cbr>\u003cbr>\nBloom was visually designed to facilitate discovery, reward curiosity, and reinforce the player's emotional journey of growth and renewal."

          "text|A Blooming World#0": {
            "body": "Colorful flowers were designed to mark unique locations across the planets and aid intuitive navigation. Soft pastel hues and gradients invite calm exploration, with noise textures gently animating across the surface of stems and petals to give them a breathing quality. Each planted seed blooms new vibrant flowers around the player, harmonizing with their song and signifying transformation."
          },
          "text|Character Design#0": {
            "body": "Bloom's sole character embodies innocence and vulnerability. As they encounter the daring flowers, they learn to use their hidden voice which shines from within. I exaggerated facial features - expressive eyes, ears, and an absent mouth - to emphasize their heightened awareness and silent, observing nature."
          },

            "title": "Visual Development",
            "body": "I collected artistic\/photo references and created concept art and guides to maintain the visual cohesion of environmental assets, animations, and interactions, which helped align the team's 3D artists and supported game design ideation."

  if (window.MutationObserver) {
    var mo = new MutationObserver(function () { syncState(); check(); });
    LB_IDS.concat('pg-overlay').forEach(function (id) {
      var e = document.getElementById(id);
      if (e) mo.observe(e, { attributes: true, attributeFilter: ['class'] });
    });
  }

  /* toolbar background (main-content mode only): the X shows wherever the
     toolbar would otherwise show the hidden cursor ('none' — inherited from
     html.xm-main .left); buttons / links have their own cursor and keep it */
  function overToolbarBg(t) {
    if (!root.classList.contains('xm-main') || !t || !t.closest || !t.closest('.left')) return false;
    try { return getComputedStyle(t).cursor === 'none'; } catch (e) { return false; }
  }
  function closeArea(t) {
    return !!(t && t.closest && t.closest(BACKDROPS)) || overToolbarBg(t);
  }
  function check() {
    if (!has || !root.classList.contains('cc-x')) { set(false); return; }
    set(closeArea(document.elementFromPoint(x, y)));
  }
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType && e.pointerType !== 'mouse') { set(false); return; }
    x = e.clientX; y = e.clientY; has = true;
    if (!root.classList.contains('cc-x')) { if (on) set(false); return; }
    set(closeArea(e.target));
  }, { passive: true });

  /* main-content mode: a click anywhere in the toolbar closes the expanded
     media — on its background that's the whole point; on a button / link the
     button still does its job (the click isn't stopped) and the media closes
     with it, so nothing stays expanded behind a navigation */
  document.addEventListener('click', function (e) {
    if (!root.classList.contains('xm-main')) return;
    var t = e.target;
    if (!t || !t.closest || !t.closest('.left')) return;
    if (window.closeExpandedMedia) window.closeExpandedMedia();
  }, true);

  /* opening / closing under a still mouse: re-test once now and once the
     open/close transition has settled */
  function later() { setTimeout(check, 0); setTimeout(check, 380); }
  document.addEventListener('click', later, true);
  document.addEventListener('keydown', later, true);
  document.addEventListener('pointerdown', function (e) { if (e.pointerType && e.pointerType !== 'mouse') set(false); }, true);
  document.addEventListener('mouseout', function (e) { if (!e.relatedTarget) set(false); });
  window.addEventListener('blur', function () { set(false); });
  window.__closeCursorSync = function () { syncState(); check(); };
  syncState();
})();
</script>
